name: Verificação semanal

# Roda contra as origens de verdade toda segunda, 6h de Brasília: rotas da API
# e da CLI, estimativa, coleta real de cada fonte, conteúdo nos três formatos,
# filtros, resiliência e pico de memória nas coletas grandes. As origens mudam
# sem aviso (endpoint que some, ano que atrasa, coluna renomeada); a suíte
# offline não enxerga isso. Quando algo quebra, abre uma issue com o resumo,
# ou comenta na que já estiver aberta.

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: verificacao-semanal
  cancel-in-progress: false

jobs:
  verificar:
    name: ${{ matrix.camada }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        camada: [rotas, conteudo, filtros, resiliencia, volume, interface]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # O runner tem 14 GB livres; o ENANI em três formatos e as coletas em
      # paralelo passam disso, e o runner cai sem deixar log. Os SDKs
      # pré-instalados que o Guaraci não usa liberam mais de 20 GB.
      - name: Liberar disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[datasus,api,dev]"

      # A interface é percorrida num navegador real. O script abre o Chrome
      # (channel="chrome"), por isso o runner instala esse canal, com as
      # dependências de sistema, e não só o Chromium do Playwright.
      - name: Instalar Playwright e Chrome
        if: matrix.camada == 'interface'
        run: |
          pip install playwright
          python -m playwright install --with-deps chrome

      - name: Verificar
        env:
          # Opcionais: sem elas as fontes com credencial saem como puladas.
          GUARACI_QUALAR_LOGIN: ${{ secrets.GUARACI_QUALAR_LOGIN }}
          GUARACI_QUALAR_SENHA: ${{ secrets.GUARACI_QUALAR_SENHA }}
          GUARACI_FIRMS_MAP_KEY: ${{ secrets.GUARACI_FIRMS_MAP_KEY }}
          GUARACI_EARTHDATA_TOKEN: ${{ secrets.GUARACI_EARTHDATA_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: |
          status=0
          mkdir -p reports
          # pipefail: sem ele o código de saída é o do tee e a falha passa verde.
          set -o pipefail
          roda() { python "$@" 2>&1 | tee -a saida.log || status=1; }
          case "${{ matrix.camada }}" in
            rotas)
              roda scripts/verificar_rotas.py --camada offline
              roda scripts/verificar_rotas.py --camada discovery
              roda scripts/verificar_rotas.py --camada jobs ;;
            conteudo)    roda scripts/verificar_conteudo.py --workers 2 ;;
            filtros)     roda scripts/verificar_filtros.py --workers 4 ;;
            resiliencia) roda scripts/verificar_resiliencia.py ;;
            # Pico de memória acima de 4 GB é falha. Ficam de fora os dois
            # casos de mais de 45 minutos (dengue_250_paginas e sih_sp_ano).
            # Sobe a API com dados temporários, espera responder e percorre a
            # interface; depois valida, no mesmo Python, os corpos que ela
            # montou. As recusas listadas (19 em 2026-10-19) são as fontes sem
            # padrão de propósito, com o formulário intocado; entram no resumo.
            interface)
              export GUARACI_DATA_ROOT="$(mktemp -d)"
              python -m uvicorn guaraci.api.main:app --port 8766 > uvicorn.log 2>&1 &
              for _ in $(seq 1 60); do
                curl -fs http://127.0.0.1:8766/sources > /dev/null && break
                sleep 2
              done
              curl -fs http://127.0.0.1:8766/sources > /dev/null || { echo "FALHA a API não respondeu em 120 s"; cat uvicorn.log; status=1; }
              roda scripts/verificar_interface.py --url http://127.0.0.1:8766
              roda scripts/verificar_interface.py --validar ;;
            volume)      roda scripts/verificar_volume.py --casos srag_2024_csv,srag_2024_sqlite,sisagua_tratamento_parquet,sisagua_mensal_basicos_parquet,sisagua_mensal_basicos_sqlite,enani_sqlite,vigimed_reacoes_sqlite,sih_sp_mes ;;
          esac
          {
            echo "### ${{ matrix.camada }}"
            grep -E "^([0-9]+ (fontes|casos|corpos)|FALHA|PROBLEMA|RECUSA)" saida.log | sed 's/^/    /' || true
          } > resumo.md
          cat resumo.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verificacao-${{ matrix.camada }}
          path: |
            reports/verificacao_*.json
            reports/verificacao_interface/
            saida.log
            uvicorn.log
            resumo.md
          retention-days: 90

  relatar:
    name: abrir issue se falhou
    needs: verificar
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: verificacao-*

      - name: Abrir ou comentar a issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo "A verificação semanal de $(date -u +%Y-%m-%d) encontrou falhas."
            echo "Execução: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            cat verificacao-*/resumo.md 2>/dev/null
          } > corpo.md
          gh label create verificacao-semanal --color D93F0B \
            --description "Falha na verificação semanal contra as origens" 2>/dev/null || true
          aberta=$(gh issue list --label verificacao-semanal --state open --json number --jq '.[0].number')
          if [ -n "$aberta" ]; then
            gh issue comment "$aberta" --body-file corpo.md
          else
            gh issue create --title "Verificação semanal: falhas contra as origens" \
              --label verificacao-semanal --body-file corpo.md
          fi
