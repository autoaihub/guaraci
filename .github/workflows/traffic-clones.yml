name: Track clone traffic

# A API de tráfego do GitHub só retém 14 dias. Este job roda diariamente,
# acumula o histórico em .github/traffic/clones.json e comita a atualização.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traffic-clones
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Acumula clonagens
        env:
          # PAT com acesso de push (o GITHUB_TOKEN padrão não lê /traffic).
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python scripts/track_clone_traffic.py

      - name: Comita o histórico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/traffic/clones.json .github/traffic/clones-badge.json
          if git diff --staged --quiet; then
            echo "sem mudanças no histórico de clonagens"
          else
            git commit -m "chore(traffic): atualiza histórico acumulado de clonagens"
            git push
          fi
