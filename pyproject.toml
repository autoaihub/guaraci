[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guaraci"
# Fonte única da versão: guaraci/__init__.py (__version__), lida estaticamente
# pelo setuptools via [tool.setuptools.dynamic].
dynamic = ["version"]
description = "Brazilian public data integration platform for scientific research"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Luis Felipe Vogel Lopes", email = "vogel@usp.br"},
    {name = "Pedro Guilherme dos Reis Teixeira", email = "pedro.guilherme2305@usp.br"},
    {name = "Robson Parmezan Bonidia"},
    {name = "André Carlos Ponce de Leon Ferreira de Carvalho"}
]
maintainers = [
    {name = "Luis Felipe Vogel Lopes", email = "vogel@usp.br"}
]
keywords = ["datasus", "public-health", "epidemiology", "brazil", "data-science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Medical Science Apps."
]
requires-python = ">=3.11"
dependencies = [
    # `collect_schema()` (guaraci/datasus/filtering.py, frames.py, sinan.py) só
    # existe a partir do polars 1.0; com 0.20 o pacote instala e quebra em
    # execução.
    "polars>=1.0.0",
    "pyarrow>=14.0.0",
    "tqdm>=4.64.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    # Sem teto (o `<0.7.0` daqui era exigência do pysus, removido na 0.7.0) e
    # com piso baixo de propósito: uma instalação limpa resolve 0.7.3, e quem
    # mantém pysus no mesmo ambiente por outra razão continua conseguindo
    # instalar o Guaraci, já que o pysus prende loguru em 0.6.x. A suíte passa
    # nas duas versões, então exigir 0.7 só excluiria gente sem ganho nenhum.
    "loguru>=0.6.0",
    "pandas>=2.0.0",
    # Importado diretamente em guaraci/utils/mapping.py; vinha só de carona no
    # pandas.
    "numpy>=1.26.0",
    # guaraci/datasus/ftp/orchestration.py precisa dele para rodar dentro de um
    # loop já em execução (Jupyter, por exemplo), no caminho FTP padrão.
    "nest-asyncio>=1.5.6"
]

[project.optional-dependencies]
# The only DATASUS backend since 0.7.0: a direct anonymous-FTP connection to
# ftp.datasus.gov.br. Decodes .dbc via pyreaddbc (-> .dbf) + dbfread
# (-> records), which is 2 dependencies against the ~20 that the PySUS path
# used to pull in transitively. The `datasus-legacy` extra that carried PySUS
# was removed in 0.7.0, as announced when 0.6.0 made FTP the default.
datasus = [
    "pyreaddbc>=2.0.0",
    "dbfread>=2.0.7"
]
# Legacy SNIS via Base dos Dados (BigQuery). Opt-in; the default SNIS path is the
# gov.br crawler, so these heavy Google deps are not part of the core install.
snis-legacy = [
    "google-cloud-bigquery>=3.11.0",
    "db-dtypes>=1.2.0"
]
api = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",
    "aiofiles>=23.2.0"
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.9.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.6.0",
    "pre-commit>=3.5.0"
]
# Agregado autorreferente: sem duplicar pins, não há como divergir dos extras acima.
full = [
    "guaraci[datasus,snis-legacy,api,dev]"
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.24.0"
]
viz = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.17.0"
]

[project.urls]
Homepage = "https://github.com/autoaihub/guaraci"
Documentation = "https://autoaihub.github.io/guaraci/docs.html"
Repository = "https://github.com/autoaihub/guaraci"
Issues = "https://github.com/autoaihub/guaraci/issues"
License = "https://github.com/autoaihub/guaraci/blob/main/LICENSE"
Citation = "https://github.com/autoaihub/guaraci/blob/main/CITATION.cff"
TermsOfUse = "https://github.com/autoaihub/guaraci/blob/main/TERMS_OF_USE.md"

[project.scripts]
guaraci = "guaraci.cli.main:app"

[tool.setuptools.dynamic]
version = {attr = "guaraci.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["guaraci*"]

[tool.setuptools.package-data]
guaraci = ["py.typed", "config/*.yaml", "api/static/*", "data/*.json"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
markers = [
    "smoke: live network smoke tests (opt-in via GUARACI_*_SMOKE env vars); deselect with -m 'not smoke'",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["guaraci"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError"
]
